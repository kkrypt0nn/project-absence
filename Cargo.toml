[package]
name = "project-absence"
description = "👁️  Uncover the unseen"
version = "0.13.0"
license = "MIT"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE.md",
    "/README.md",
    "/TERMS_OF_USE.md",
    "/src/**",
]
repository = "https://github.com/kkrypt0nn/project-absence"
edition = "2024"

[features]
default = []
clipboard = ["dep:arboard"]

[dependencies]
arboard = { version = "=3.6.1", optional = true }
base64 = "=0.22.1"
chrono = "=0.4.43"
clap = { version = "=4.5.54", features = ["derive"] }
human_bytes = "=0.4.3"
memory-stats = "=1.2.0"
mlua = { version = "=0.11.5", features = ["lua54", "send", "vendored"] }
rand = "=0.9.2"
regex = "=1.12.2"
reqwest = { version = "=0.13.1", features = ["blocking", "json"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
simple-semaphore = "=0.2.0"
tangra = "=1.3.0"
toml = "=0.9.11"
x509-parser = "=0.18.0"
